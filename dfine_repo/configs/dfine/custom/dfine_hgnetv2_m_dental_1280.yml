__include__: [
  '../../dataset/custom_detection.yml',
  '../../runtime.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
]

output_dir: /media/venkatesh/academics/aneesa-20261015T111900Z-1-001/aneesa/yolov11_training/runs/dfine_m_1280

num_classes: 48
remap_mscoco_category: False
eval_spatial_size: [1280, 1280]

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 100
checkpoint_freq: 5

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/venkatesh/academics/aneesa-20261015T111900Z-1-001/aneesa/yolov11_training/datasets/aneesa/images/train
    ann_file: /media/venkatesh/academics/aneesa-20261015T111900Z-1-001/aneesa/yolov11_training/datasets/aneesa/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # RandomHorizontalFlip disabled for dental quadrant consistency
        - {type: Resize, size: [1280, 1280]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 80
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  shuffle: True
  total_batch_size: 4
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: 3
    stop_epoch: 80
    ema_restart_decay: 0.9999

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/venkatesh/academics/aneesa-20261015T111900Z-1-001/aneesa/yolov11_training/datasets/aneesa/images/val
    ann_file: /media/venkatesh/academics/aneesa-20261015T111900Z-1-001/aneesa/yolov11_training/datasets/aneesa/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1280, 1280]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 4
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
